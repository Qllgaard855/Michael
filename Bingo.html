<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <title>Jule-Bingo - Ryst Posen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Cinzel:wght@600;700&display=swap');
    :root {
      --green:#0f3d2e;
      --evergreen:#1a5c44;
      --deep-red:#b0142c;
      --deep-red-2:#9f0f27;
      --gold:#f6d167;
      --gold-2:#f7b733;
      --cream:#f7f1e6;
      --card:#fffdf8;
      --mint:#d7f3e4;
      --shadow:0 20px 60px rgba(0,0,0,0.15);
      --glow:0 0 0 6px rgba(240,205,120,0.35);
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      font-family:'Fredoka','Segoe UI',sans-serif;
      background:
        linear-gradient(180deg, #0a1f15 0%, #0c261b 30%, #0f3d2e 100%),
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.12), transparent 35%),
        radial-gradient(circle at 80% 0%, rgba(255,255,255,0.09), transparent 40%);
      color:#122019;
      min-height:100vh;
      padding:18px;
    }
    header {
      text-align:center;
      color:#fefdf8;
      margin-bottom:16px;
    }
    header h1 {
      font-family:'Cinzel','Fredoka',serif;
      letter-spacing:2px;
      margin:0;
      font-size:34px;
      text-shadow:0 4px 20px rgba(0,0,0,0.4);
    }
    header p { margin:6px 0 0; opacity:0.9; }
    .app {
      background:var(--cream);
      border-radius:22px;
      padding:18px;
      box-shadow:var(--shadow);
      border:2px solid rgba(255,255,255,0.2);
    }
    .setup {
      display:grid;
      gap:12px;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      align-items:end;
      margin-bottom:12px;
    }
    label { font-weight:600; color:#1c2b24; display:flex; flex-direction:column; gap:6px; }
    input, select, button {
      font:inherit;
      padding:10px 12px;
      border-radius:10px;
      border:1px solid #d7cbb4;
      background:#fffdf8;
      color:#1a1f1c;
      outline:none;
    }
    input:focus, select:focus, button:focus { box-shadow:var(--glow); border-color:var(--deep-red); }
    .primary {
      background:linear-gradient(135deg, var(--deep-red), #d92b44);
      color:white;
      border:none;
      cursor:pointer;
      font-weight:700;
      letter-spacing:0.5px;
    }
    .primary:active { transform:translateY(1px); }
    .primary:disabled { opacity:0.6; cursor:not-allowed; }
    .table-wrap {
      position:relative;
      background:radial-gradient(circle at 30% 20%, rgba(255,255,255,0.15), transparent 40%), linear-gradient(160deg, #0f3d2e 0%, #144b38 40%, #0f3d2e 100%);
      border-radius:26px;
      padding:18px;
      overflow:hidden;
      border:3px solid #103023;
      box-shadow:var(--shadow);
      min-height:380px;
    }
    .table-wrap::before, .table-wrap::after {
      content:"";
      position:absolute;
      inset:-30% -10%;
      background:radial-gradient(circle, rgba(255,255,255,0.05) 0, transparent 55%);
      pointer-events:none;
    }
    .table-wrap::after {
      inset:-20% 40%;
      background:radial-gradient(circle, rgba(255,255,255,0.08) 0, transparent 60%);
    }
    .board-grid {
      display:grid;
      gap:12px;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      margin-top:14px;
    }
    .board {
      background:var(--card);
      border-radius:18px;
      padding:12px 10px 14px;
      border:2px solid rgba(35,61,50,0.1);
      box-shadow:0 12px 24px rgba(0,0,0,0.14);
      position:relative;
      transition:transform 0.2s ease, box-shadow 0.2s ease;
      cursor:pointer;
      overflow:hidden;
      isolation:isolate;
    }
    .board::before {
      content:"";
      position:absolute;
      inset:-8px -8px auto -8px;
      height:16px;
      background:repeating-linear-gradient(135deg, #d92b44 0 16px, #f6d167 16px 32px, #1a5c44 32px 48px);
      border-bottom:3px solid rgba(0,0,0,0.05);
      z-index:0;
    }
    .board::after {
      content:"";
      position:absolute;
      inset:auto 12px 8px 12px;
      height:12px;
      background:radial-gradient(circle at 20% 50%, rgba(255,255,255,0.6), transparent 55%);
      opacity:0.4;
      z-index:0;
    }
    .board:hover { transform:translateY(-3px); box-shadow:0 14px 30px rgba(0,0,0,0.16); }
    .board.winner { outline:3px solid var(--gold); box-shadow:0 0 0 6px rgba(246,209,103,0.35), var(--shadow); }
    .board-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:6px;
      gap:10px;
      position:relative;
      z-index:1;
    }
    .name-tag {
      background:linear-gradient(135deg, #f9e9c7, #f2d9a2);
      padding:6px 10px;
      border-radius:12px;
      font-weight:700;
      color:#5b3b13;
      border:1px solid rgba(107,78,38,0.3);
      min-width:90px;
      text-align:center;
      box-shadow:0 8px 14px rgba(0,0,0,0.1);
    }
    .name-tag.empty { opacity:0.7; font-weight:600; }
    .board h3 { margin:0; color:var(--deep-red); font-size:16px; letter-spacing:0.3px; }
    .card-name-hint { font-size:12px; color:#4f4637; margin:-2px 0 6px; position:relative; z-index:1; }
    .cells {
      display:grid;
      gap:4px;
      grid-template-columns:repeat(var(--cols), 1fr);
      position:relative;
      z-index:1;
    }
    .cell {
      background:linear-gradient(135deg, #fdf9ef 0%, #f3e6cd 100%);
      border-radius:10px;
      padding:10px 6px;
      text-align:center;
      font-weight:800;
      color:#193026;
      border:1px solid rgba(31,57,45,0.08);
      position:relative;
      overflow:hidden;
      min-height:46px;
      box-shadow:inset 0 2px 0 rgba(255,255,255,0.8);
    }
    .cell::after {
      content:"";
      position:absolute;
      inset:0;
      background:repeating-linear-gradient(45deg, rgba(240,196,94,0.06) 0 10px, rgba(176,20,44,0.04) 10px 20px);
      opacity:0.7;
      pointer-events:none;
    }
    .cell.marked {
      background:linear-gradient(145deg, rgba(255,255,255,0.95), #f9e2b5);
      color:#0f3d2e;
      border-color:rgba(240,196,94,0.95);
      box-shadow:inset 0 0 0 2px rgba(240,196,94,0.7), 0 6px 14px rgba(0,0,0,0.1);
    }
    .cell .star {
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--deep-red);
      font-size:22px;
      opacity:0;
      transform:scale(0.7);
      transition:opacity 0.22s ease, transform 0.22s ease;
      pointer-events:none;
      text-shadow:0 2px 8px rgba(0,0,0,0.16);
    }
    .cell.marked .star { opacity:1; transform:scale(1); }
    .centerpiece {
      position:relative;
      margin:6px auto 4px;
      max-width:320px;
      text-align:center;
    }
    .bag {
      background:linear-gradient(135deg, #b0142c 0%, #8a0f22 50%, #c51a36 100%);
      color:white;
      border-radius:22px 22px 18px 18px;
      padding:16px;
      font-weight:800;
      box-shadow:0 16px 40px rgba(0,0,0,0.25), inset 0 0 0 2px rgba(255,255,255,0.08);
      position:relative;
      text-transform:uppercase;
      letter-spacing:1px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }
    .bag::before {
      content:"";
      position:absolute;
      inset:-10px 16px auto 16px;
      height:12px;
      background:#f6d167;
      border-radius:12px;
      box-shadow:0 6px 14px rgba(0,0,0,0.18);
    }
    .bag::after {
      content:"❄";
      position:absolute;
      top:-16px;
      right:12px;
      font-size:18px;
      opacity:0.85;
    }
    .shake { animation:shake 0.72s ease; }
    @keyframes shake {
      10%, 90% { transform:translateX(-2px); }
      20%, 80% { transform:translateX(4px); }
      30%, 50%, 70% { transform:translateX(-6px); }
      40%, 60% { transform:translateX(6px); }
    }
    .controls { display:flex; justify-content:center; gap:10px; margin:10px 0; flex-wrap:wrap; }
    .number-display {
      display:flex;
      align-items:center;
      gap:14px;
      flex-wrap:wrap;
      justify-content:center;
      margin-top:8px;
    }
    .pill {
      background:rgba(255,255,255,0.9);
      padding:8px 12px;
      border-radius:14px;
      color:#0f3d2e;
      font-weight:700;
      border:1px solid rgba(0,0,0,0.08);
      box-shadow:0 10px 24px rgba(0,0,0,0.18);
    }
    .last-call {
      background:linear-gradient(135deg, #f6d167, #f7b733);
      color:#5b230f;
      border-radius:18px;
      padding:10px 14px;
      font-size:22px;
      font-weight:800;
      min-width:120px;
      text-align:center;
      box-shadow:0 10px 24px rgba(0,0,0,0.18);
    }
    .history {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      max-width:460px;
      margin:10px auto 0;
      justify-content:center;
    }
    .history .ball {
      background:linear-gradient(145deg, #ffffff, #f3e0c3);
      border:2px solid rgba(0,0,0,0.05);
      border-radius:50%;
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      font-weight:800;
      color:#0f3d2e;
      box-shadow:0 10px 20px rgba(0,0,0,0.16);
    }
    .drop-zone { position:relative; min-height:110px; }
    .falling {
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      width:96px;
      height:96px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:radial-gradient(circle at 30% 30%, #fffdf7 0, #f2d9a6 80%);
      color:#851123;
      font-size:36px;
      font-weight:800;
      box-shadow:0 14px 32px rgba(0,0,0,0.28);
      animation:fall 0.9s ease forwards;
      border:2px solid rgba(255,255,255,0.6);
    }
    @keyframes fall {
      0% { opacity:0; transform:translate(-50%, -90px) scale(0.8); }
      50% { opacity:1; transform:translate(-50%, 10px) scale(1.02); }
      100% { opacity:1; transform:translate(-50%, 28px) scale(1); }
    }
    .status {
      text-align:center;
      margin:8px 0;
      color:#1c2b24;
      font-weight:700;
    }
    .small { font-size:13px; opacity:0.8; font-weight:600; }
    .banner {
      margin:10px auto;
      max-width:680px;
      text-align:center;
      padding:10px 14px;
      border-radius:16px;
      background:rgba(246,209,103,0.12);
      color:#0f3d2e;
      border:1px solid rgba(246,209,103,0.4);
      font-weight:700;
    }
    .mega-overlay {
      position:fixed;
      inset:0;
      background:radial-gradient(circle at 50% 40%, rgba(255,255,255,0.35), rgba(0,0,0,0.55)), linear-gradient(135deg, rgba(176,20,44,0.9), rgba(26,92,68,0.92));
      display:none;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      z-index:50;
      color:white;
      backdrop-filter:blur(2px);
      padding:20px;
    }
    .mega-overlay.show { display:flex; animation:fadeIn 0.12s ease; }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    .mega-number {
      width:320px;
      max-width:88vw;
      aspect-ratio:1/1;
      border-radius:32px;
      background:radial-gradient(circle at 30% 30%, #fffef9 0, #f7d888 55%, #c51a36 100%);
      display:grid;
      place-items:center;
      box-shadow:0 28px 90px rgba(0,0,0,0.4), 0 0 0 12px rgba(255,255,255,0.22);
      position:relative;
      overflow:hidden;
      border:6px solid #f6d167;
      text-shadow:0 10px 30px rgba(0,0,0,0.35);
      animation:bounceIn 0.6s ease;
    }
    .mega-number::after {
      content:"";
      position:absolute;
      inset:12px;
      border:4px dashed rgba(255,255,255,0.55);
      border-radius:24px;
    }
    .mega-number .value {
      font-size:160px;
      font-weight:900;
      color:#8a0f22;
      text-shadow:0 10px 32px rgba(0,0,0,0.35), 0 0 0 10px rgba(255,255,255,0.2);
      text-align:center;
      padding:8px;
    }
    .mega-number .sparkle {
      position:absolute;
      inset:0;
      background:radial-gradient(circle at 20% 20%, rgba(255,255,255,0.6), transparent 35%), radial-gradient(circle at 80% 30%, rgba(255,255,255,0.45), transparent 38%), radial-gradient(circle at 50% 80%, rgba(255,255,255,0.35), transparent 40%);
    }
    .mega-call {
      margin-top:16px;
      font-size:26px;
      font-weight:800;
      text-align:center;
      padding:10px 18px;
      border-radius:18px;
      background:rgba(0,0,0,0.25);
      border:2px solid rgba(255,255,255,0.35);
      text-shadow:0 4px 12px rgba(0,0,0,0.35);
    }
    .bingo-title {
      color:white;
      font-size:32px;
      font-weight:900;
      text-align:center;
      margin-bottom:14px;
      text-shadow:0 6px 18px rgba(0,0,0,0.45);
      letter-spacing:1px;
    }
    .bingo-number { background:radial-gradient(circle at 35% 35%, #fffef9 0, #fdf1c8 55%, #1a5c44 100%); }
    .bingo-number .value { color:#0f3d2e; }
    .bingo-number .value { font-size:clamp(54px, 11vw, 130px); }
    @keyframes bounceIn {
      0% { transform:scale(0.5); opacity:0; }
      70% { transform:scale(1.05); opacity:1; }
      100% { transform:scale(1); }
    }
    @media (max-width:900px) {
      .board-grid { grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }
      .last-call { font-size:20px; }
    }
    @media (max-width:720px) {
      body { padding:12px; }
      .app { padding:14px; }
      .setup { grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
      .cells { gap:3px; }
      .cell { padding:8px 4px; }
      header h1 { font-size:26px; }
      .mega-number { width:260px; }
      .mega-number .value { font-size:120px; }
      .mega-call { font-size:20px; }
      .board-grid { grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); }
      .drop-zone { min-height:90px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Jule-Bingo - Ryst Posen</h1>
    <p>Vælg antal plader, ryst posen og lad numrene flyve hen over julebordet.</p>
  </header>
  <div class="app">
    <form class="setup" id="setupForm">
      <label>Antal spilleplader
        <input type="number" id="boardCount" value="4" min="1" max="12" />
      </label>
      <label>Rækker (standard 3)
        <input type="number" id="rows" value="3" min="2" max="6" />
      </label>
      <label>Kolonner (standard 9)
        <input type="number" id="cols" value="9" min="3" max="10" />
      </label>
      <button class="primary" type="submit">Start spil</button>
    </form>
    <div class="banner" id="phaseBanner">Fase 1: Vandret stribe giver første BINGO</div>
    <div class="table-wrap">
      <div class="centerpiece">
        <div class="bag" id="bag">Ryst posen</div>
        <div class="controls">
          <button class="primary" id="shakeBtn" type="button">Ryst posen</button>
          <button class="primary" id="drawBtn" type="button">Nyt nummer</button>
        </div>
      </div>
      <div class="number-display">
        <div class="pill">Sidst trukket</div>
        <div class="last-call" id="lastNumber">--</div>
        <div class="pill small" id="remaining">Klar til start</div>
      </div>
      <div class="drop-zone" id="dropZone"></div>
      <div class="history" id="history"></div>
      <div class="status" id="status"></div>
      <div class="board-grid" id="boardGrid"></div>
    </div>
  </div>

  <div class="mega-overlay" id="megaOverlay">
    <div class="mega-number">
      <div class="sparkle"></div>
      <div class="value" id="megaValue">24</div>
    </div>
    <div class="mega-call" id="megaCall"></div>
  </div>

  <div class="mega-overlay" id="bingoOverlay">
    <div class="bingo-title" id="bingoTitle">BINGO</div>
    <div class="mega-number bingo-number">
      <div class="sparkle"></div>
      <div class="value" id="bingoName">Spiller</div>
    </div>
    <div class="mega-call" id="bingoSub"></div>
  </div>

  <script>
    const state = {
      boards: [],
      drawPool: [],
      drawn: [],
      stage: 'row',
      winners: [],
      gameOver: false
    };

    const callNames = {
      1: 'Den ensomme / En mand',
      2: 'Næstkommanderende',
      3: 'Røvballerne',
      8: 'Den tykke dame',
      11: 'To tynde drenge',
      13: 'Det uheldige tal',
      18: 'Et umage par',
      19: 'Nimmer nutten',
      22: 'Vilde svaner',
      24: 'Juleaften',
      25: 'Juleaften i England',
      27: 'Dronning Ingrid',
      40: 'Smør 40',
      66: 'Lange tasker',
      68: 'Hippie',
      69: 'Det frække tal',
      77: 'To drenge med brækket hals',
      88: 'To tykke damer',
      90: 'Gamle Ole'
    };

    const boardGrid = document.getElementById('boardGrid');
    const bag = document.getElementById('bag');
    const shakeBtn = document.getElementById('shakeBtn');
    const drawBtn = document.getElementById('drawBtn');
    const dropZone = document.getElementById('dropZone');
    const lastNumber = document.getElementById('lastNumber');
    const historyEl = document.getElementById('history');
    const remainingEl = document.getElementById('remaining');
    const statusEl = document.getElementById('status');
    const phaseBanner = document.getElementById('phaseBanner');
    const megaOverlay = document.getElementById('megaOverlay');
    const megaValue = document.getElementById('megaValue');
    const megaCall = document.getElementById('megaCall');
    const bingoOverlay = document.getElementById('bingoOverlay');
    const bingoTitle = document.getElementById('bingoTitle');
    const bingoName = document.getElementById('bingoName');
    const bingoSub = document.getElementById('bingoSub');

    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function generateBoard(rows, cols, maxNumber) {
      const nums = [];
      while (nums.length < rows * cols) {
        const n = randInt(1, maxNumber);
        if (!nums.includes(n)) nums.push(n);
      }
      const grid = [];
      for (let r = 0; r < rows; r++) {
        grid.push(nums.slice(r * cols, (r + 1) * cols));
      }
      return grid;
    }

    function buildPool(boards) {
      const set = new Set();
      boards.forEach(b => b.numbers.flat().forEach(n => set.add(n)));
      return shuffle([...set]);
    }

    function renderBoards() {
      boardGrid.innerHTML = '';
      state.boards.forEach((board, idx) => {
        const el = document.createElement('div');
        el.className = 'board';
        el.style.setProperty('--cols', board.cols);
        el.dataset.id = board.id;

        const header = document.createElement('div');
        header.className = 'board-header';
        const title = document.createElement('h3');
        title.textContent = `Plade ${idx + 1}`;
        const tag = document.createElement('div');
        tag.className = 'name-tag' + (board.name ? '' : ' empty');
        tag.textContent = board.name || 'Tryk for navn';
        header.appendChild(title);
        header.appendChild(tag);
        el.appendChild(header);

        const hint = document.createElement('div');
        hint.className = 'card-name-hint';
        hint.textContent = 'Tryk for at vælge plade og navn';
        el.appendChild(hint);

        const cells = document.createElement('div');
        cells.className = 'cells';
        board.numbers.forEach((row, rIdx) => {
          row.forEach((val, cIdx) => {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.textContent = val;
            cell.dataset.value = val;
            if (board.marked[rIdx][cIdx]) cell.classList.add('marked');
            const star = document.createElement('div');
            star.className = 'star';
            star.textContent = '✶';
            cell.appendChild(star);
            cells.appendChild(cell);
          });
        });
        el.appendChild(cells);

        el.addEventListener('click', () => {
          const name = prompt('Indtast dit navn til denne plade:', board.name || '');
          if (name !== null) {
            board.name = name.trim() || 'Spiller';
            renderBoards();
          }
        });

        if (board.winner) el.classList.add('winner');
        boardGrid.appendChild(el);
      });
    }

    function updateHistory() {
      historyEl.innerHTML = '';
      const recent = state.drawn.slice(-10).reverse();
      recent.forEach(n => {
        const ball = document.createElement('div');
        ball.className = 'ball';
        ball.textContent = n;
        historyEl.appendChild(ball);
      });
    }

    function evaluateBoard(board) {
      checkRows(board);
      checkFull(board);
    }

    function checkRows(board) {
      const completed = board.marked.reduce((acc, row) => acc + (row.every(Boolean) ? 1 : 0), 0);
      if (completed > board.rowsWon) {
        for (let i = board.rowsWon + 1; i <= completed; i++) {
          announceRow(board, i);
        }
        board.rowsWon = completed;
      }
    }

    function checkFull(board) {
      if (board.fullAnnounced) return;
      const full = board.marked.every(row => row.every(Boolean));
      if (full) {
        board.fullAnnounced = true;
        announceFull(board);
      }
    }

    function markNumber(n) {
      state.boards.forEach(board => {
        let changed = false;
        board.numbers.forEach((row, rIdx) => {
          row.forEach((val, cIdx) => {
            if (val === n && !board.marked[rIdx][cIdx]) {
              board.marked[rIdx][cIdx] = true;
              changed = true;
            }
          });
        });
        if (changed) {
          evaluateBoard(board);
        }
      });
      renderBoards();
    }

    function showBingo(title, nameText, subtext = '') {
      bingoTitle.textContent = title;
      bingoName.textContent = nameText || 'Spiller';
      if (subtext) {
        bingoSub.textContent = subtext;
        bingoSub.style.display = 'block';
      } else {
        bingoSub.style.display = 'none';
      }
      bingoOverlay.classList.add('show');
      setTimeout(() => bingoOverlay.classList.remove('show'), 1700);
    }

    function announceRow(board, rowNumber) {
      const name = board.name || 'Ukendt spiller';
      const label = `BINGO, ${rowNumber} RÆKKE`;
      statusEl.textContent = `${label} - ${name} på plade ${board.index + 1}`;
      board.winner = true;
      showBingo(label, name, `Plade ${board.index + 1}`);
      if (state.stage === 'row') {
        state.stage = 'full';
        phaseBanner.textContent = 'Fase 2: Nu spilles der på fuld plade';
      }
      confetti();
    }

    function announceFull(board) {
      const name = board.name || 'Ukendt spiller';
      const msg = `BINGO BINGO BINGO - ${name} - BINGO BINGO BINGO`;
      statusEl.textContent = msg;
      board.winner = true;
      showBingo('BINGO BINGO BINGO', name, 'Vi har en vinder!');
      state.gameOver = true;
      drawBtn.disabled = true;
      confetti();
    }

    function confetti() {
      const colors = ['#f6d167','#b0142c','#1a5c44','#fffdf8'];
      for (let i = 0; i < 14; i++) {
        const piece = document.createElement('div');
        piece.style.position = 'fixed';
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.top = '-20px';
        piece.style.width = piece.style.height = '10px';
        piece.style.borderRadius = '2px';
        piece.style.background = colors[i % colors.length];
        piece.style.opacity = '0.9';
        piece.style.transform = `rotate(${Math.random() * 360}deg)`;
        piece.style.transition = 'transform 1.2s ease, top 1.2s ease, opacity 1.2s ease';
        document.body.appendChild(piece);
        requestAnimationFrame(() => {
          piece.style.top = '110%';
          piece.style.transform += ' translateY(20px)';
          piece.style.opacity = '0';
        });
        setTimeout(() => piece.remove(), 1400);
      }
    }

    function shakeBag() {
      bag.classList.remove('shake');
      void bag.offsetWidth;
      bag.classList.add('shake');
    }

    function dropNumber(n) {
      dropZone.innerHTML = '';
      const ball = document.createElement('div');
      ball.className = 'falling';
      ball.textContent = n;
      dropZone.appendChild(ball);
    }

    function showMega(n) {
      megaValue.textContent = n;
      const call = callNames[n];
      megaCall.textContent = call || '';
      megaCall.style.display = call ? 'block' : 'none';
      megaOverlay.classList.add('show');
      setTimeout(() => megaOverlay.classList.remove('show'), 1500);
    }

    function draw() {
      if (state.gameOver) {
        statusEl.textContent = 'Spillet er slut - start et nyt spil for at fortsætte.';
        return;
      }
      if (!state.drawPool.length) {
        statusEl.textContent = 'Alle mulige numre er brugt.';
        return;
      }
      const n = state.drawPool.pop();
      const call = callNames[n];
      state.drawn.push(n);
      lastNumber.textContent = n;
      remainingEl.textContent = `${state.drawPool.length} numre tilbage`;
      dropNumber(n);
      showMega(n);
      statusEl.textContent = call ? `${n} – ${call}` : `Nummer ${n}`;
      updateHistory();
      markNumber(n);
    }

    function startGame(evt) {
      evt.preventDefault();
      const count = Math.max(1, Math.min(12, parseInt(document.getElementById('boardCount').value || '4', 10)));
      const rows = Math.max(2, Math.min(6, parseInt(document.getElementById('rows').value || '3', 10)));
      const cols = Math.max(3, Math.min(10, parseInt(document.getElementById('cols').value || '9', 10)));
      const maxNumber = Math.max(90, rows * cols * 4);

      state.boards = Array.from({ length: count }, (_, idx) => {
        const numbers = generateBoard(rows, cols, maxNumber);
        return {
          id: crypto.randomUUID(),
          index: idx,
          rows,
          cols,
          numbers,
          marked: Array.from({ length: rows }, () => Array(cols).fill(false)),
          name: '',
          winner: false,
          rowsWon: 0,
          fullAnnounced: false,
          winnerLabel: ''
        };
      });
      state.drawn = [];
      state.drawPool = buildPool(state.boards);
      state.stage = 'row';
      state.winners = [];
      state.gameOver = false;
      drawBtn.disabled = false;
      phaseBanner.textContent = 'Fase 1: Vandret stribe giver første BINGO';
      lastNumber.textContent = '--';
      historyEl.innerHTML = '';
      remainingEl.textContent = `${state.drawPool.length} numre klar`;
      statusEl.textContent = 'Ryst posen og træk et nummer';
      renderBoards();
    }

    document.getElementById('setupForm').addEventListener('submit', startGame);
    shakeBtn.addEventListener('click', () => {
      shakeBag();
      statusEl.textContent = 'Posen er rystet - træk et nummer!';
    });
    drawBtn.addEventListener('click', draw);
    bag.addEventListener('click', shakeBag);

    startGame(new Event('submit'));
  </script>
</body>
</html>
